<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mind Games</title>
  <meta name="description" content="Calm puzzle and mind games from around the world.">
  <meta name="theme-color" content="#F0EEE9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mind Games">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap home">
    <input class="search" id="search" type="search" placeholder="Find a game" aria-label="Find a game">
    <div class="chips" id="chips" role="group" aria-label="Show"></div>
    <section id="recent" class="home-section" hidden>
      <h2>Continue playing</h2>
      <div class="tiles" id="recent-tiles"></div>
    </section>
    <a class="kids-banner" id="kids-banner" href="#kids">
      <span class="kids-star" aria-hidden="true">★</span>
      <span><b>Great for kids</b><small>Gentle games that build counting, memory and logic</small></span>
    </a>
    <div class="install" id="install" hidden>
      <img src="icon-192.png" alt="" width="44" height="44">
      <div>
        <b>Keep Mind Games on your phone</b>
        <small id="install-text">Add it to your home screen to play like an app, even offline.</small>
      </div>
      <div class="install-actions">
        <button class="btn" id="install-btn" hidden>Install</button>
        <button class="install-close" id="install-close" aria-label="Not now">✕</button>
      </div>
    </div>
    <div id="sections"></div>
    <p class="empty" id="empty" hidden>No game matches that search.</p>
  </main>
  <script src="games.js"></script>
  <script src="shell.js"></script>
  <script>
    (() => {
      const chipsEl = document.getElementById('chips');
      const sectionsEl = document.getElementById('sections');
      const search = document.getElementById('search');
      const FILTERS = [{ id: 'all', name: 'All' }, { id: 'kids', name: '★ Kids' }, ...SECTIONS];

      const tile = (g, kidsLink) => `
        <a class="tile-link" href="games/${g.id}/${kidsLink ? '?kids' : ''}" data-name="${g.name.toLowerCase()} ${g.origin.toLowerCase()} ${g.blurb.toLowerCase()}">
          <span class="mini${g.icon.length > 2 ? ' small' : ''}" aria-hidden="true">${g.icon}</span>
          <span><b>${g.name}${g.kids && !kidsLink ? ' <i class="kid" title="Great for kids">★</i>' : ''}</b><small>${g.blurb}</small></span>
        </a>`;

      chipsEl.innerHTML = FILTERS.map(f => `<button class="chip" data-f="${f.id}">${f.name}</button>`).join('');

      function draw() {
        const f = location.hash.slice(1) || 'all';
        const q = search.value.trim().toLowerCase();
        chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.f === f)));

        let groups;
        if (f === 'kids') groups = [{ id: 'kids', name: 'Great for kids', blurb: 'Each one opens on its easiest setting', games: GAMES.filter(g => g.kids), kidsLink: true }];
        else groups = SECTIONS.filter(s => f === 'all' || s.id === f).map(s => ({ ...s, games: GAMES.filter(g => g.sec === s.id) }));

        sectionsEl.innerHTML = groups.map(s => {
          const list = s.games.filter(g => !q || `${g.name} ${g.origin} ${g.blurb} ${SECTIONS.find(x => x.id === g.sec).name}`.toLowerCase().includes(q));
          if (!list.length) return '';
          return `<section class="home-section">
              <h2>${s.name} <small>${list.length}</small></h2>
              <p class="section-blurb">${s.blurb}</p>
              <div class="tiles">${list.map(g => tile(g, s.kidsLink)).join('')}</div>
            </section>`;
        }).join('');
        document.getElementById('empty').hidden = !!sectionsEl.innerHTML.trim();
        document.getElementById('kids-banner').hidden = f !== 'all' || !!q;

        const recent = (MG.store.json('recent') || []).map(id => GAMES.find(g => g.id === id)).filter(Boolean);
        document.getElementById('recent').hidden = !recent.length || f !== 'all' || !!q;
        document.getElementById('recent-tiles').innerHTML = recent.slice(0, 4).map(g => tile(g)).join('');
      }

      chipsEl.addEventListener('click', e => {
        const c = e.target.closest('.chip');
        if (!c) return;
        history.replaceState(null, '', c.dataset.f === 'all' ? location.pathname : `#${c.dataset.f}`);
        draw();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      // Install card: the browser's own prompt where available, Share-sheet instructions on iPhone and iPad.
      const install = document.getElementById('install');
      const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let promptEvent = null;
      const showInstall = () => { install.hidden = standalone || MG.store.get('install-dismissed') === '1'; };
      if (ios) {
        document.getElementById('install-text').innerHTML = 'Tap <b>Share</b> <span aria-hidden="true">⬆︎</span> in Safari, then <b>Add to Home Screen</b>.';
        showInstall();
      }
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        promptEvent = e;
        document.getElementById('install-btn').hidden = false;
        showInstall();
      });
      document.getElementById('install-btn').addEventListener('click', async () => {
        if (!promptEvent) return;
        promptEvent.prompt();
        await promptEvent.userChoice;
        promptEvent = null;
        install.hidden = true;
      });
      document.getElementById('install-close').addEventListener('click', () => { MG.store.set('install-dismissed', '1'); install.hidden = true; });
      window.addEventListener('appinstalled', () => { install.hidden = true; });

      search.addEventListener('input', draw);
      window.addEventListener('hashchange', draw);
      draw();
    })();
  </script>
</body>
</html>
