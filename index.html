<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mind Games</title>
  <meta name="description" content="Calm puzzle and mind games from around the world.">
  <meta name="theme-color" content="#F0EEE9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <section class="games" id="games"></section>
  </main>
  <script src="games.js"></script>
  <script src="shell.js"></script>
  <script>
    document.getElementById('games').innerHTML = GAMES.map(g => `
      <a class="card" href="games/${g.id}/">
        <div class="icon${g.icon.length > 2 ? ' small' : ''}">${g.icon}</div>
        <div>
          <h2>${g.name}</h2>
          <p>${g.origin} · ${g.blurb}</p>
        </div>
      </a>`).join('');
  </script>
</body>
</html>
