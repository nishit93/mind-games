<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mind Games</title>
  <meta name="description" content="Calm puzzle and mind games from around the world.">
  <meta name="theme-color" content="#F0EEE9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mind Games">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap home">
    <input class="search" id="search" type="search" placeholder="Find a game" aria-label="Find a game">
    <div id="view"></div>
    <div class="install" id="install" hidden>
      <img src="icon-192.png" alt="" width="36" height="36">
      <div>
        <b>Install Mind Games</b>
        <small id="install-text">Play like an app, even offline.</small>
      </div>
      <div class="install-actions">
        <button class="btn" id="install-btn" hidden>Install</button>
        <button class="install-close" id="install-close" aria-label="Not now">✕</button>
      </div>
    </div>
    <details id="progress" class="howto" hidden>
      <summary>Your progress and backup</summary>
      <div class="stat-row">
        <div><b id="p-streak">0</b><small>day streak</small></div>
        <div><b id="p-plays">0</b><small>games played</small></div>
        <div><b id="p-favs">0</b><small>favourites</small></div>
      </div>
      <p class="section-blurb" id="p-status"></p>
      <div class="progress-actions" id="p-actions"></div>
      <p class="section-blurb" id="p-note" aria-live="polite"></p>
    </details>
  </main>
  <script src="games.js"></script>
  <script src="progress.js"></script>
  <script src="shell.js"></script>
  <script>
    (() => {
      const view = document.getElementById('view');
      const search = document.getElementById('search');
      // The home page must draw even if progress tracking is missing (for example an old cached shell.js plus a failed progress.js).
      const P = window.MGProgress || {
        _stub: true, onChange() {}, isFav: () => false, favs: () => [], configured: () => false, syncEnabled: () => false,
        summary: () => ({ streak: 0, plays: 0, favourites: 0, days: 0 }), status: () => ({ status: 'off', lastSync: 0, hasPlayer: false }),
      };
      const byId = id => GAMES.find(g => g.id === id);
      const secName = g => SECTIONS.find(s => s.id === g.sec).name;
      const iconClass = g => ` sec-${g.sec}${g.icon.length > 2 ? ' small' : ''}`;

      // ---- Pieces: hero, shelves of icon cards, and list rows ----
      const card = (g, kidsLink) => `
        <a class="gcard" href="games/${g.id}/${kidsLink ? '?kids' : ''}" role="listitem">
          <span class="gicon${iconClass(g)}" aria-hidden="true">${g.icon}</span>
          <span class="gname">${g.name}</span>
        </a>`;

      const shelf = (id, title, games, kidsLink) => `
        <section class="shelf" data-shelf="${id}">
          <div class="shelf-head"><h2>${title}</h2><a class="see-all" href="#${id}">See all ${games.length} ›</a></div>
          <div class="rail" role="list">${games.map(g => card(g, kidsLink)).join('')}</div>
        </section>`;

      const row = (g, kidsLink) => {
        const on = P.isFav(g.id);
        return `
        <div class="item">
          <a class="item-link" href="games/${g.id}/${kidsLink ? '?kids' : ''}">
            <span class="mini${iconClass(g)}" aria-hidden="true">${g.icon}</span>
            <span class="item-text"><b>${g.name}${g.kids && !kidsLink ? ' <i class="kid" title="Great for kids">★</i>' : ''}</b><small>${g.blurb}</small></span>
          </a>
          ${P._stub ? '' : `<button class="heart" data-fav="${g.id}" aria-pressed="${on}" aria-label="${on ? 'Remove ' + g.name + ' from favourites' : 'Add ' + g.name + ' to favourites'}">${on ? '♥' : '♡'}</button>`}
        </div>`;
      };

      // One big, obvious thing to do: carry on where you left off, or try something new.
      function hero() {
        const last = (MG.store.json('recent') || []).map(byId).find(Boolean);
        const g = last || GAMES[Math.floor(Date.now() / 86400000) % GAMES.length];
        return `
        <a class="hero" href="games/${g.id}/">
          <span class="gicon${iconClass(g)}" aria-hidden="true">${g.icon}</span>
          <span class="hero-text">
            <span class="hero-label">${last ? 'Continue playing' : 'Today’s pick'}</span>
            <b>${g.name}</b>
            <small>${g.blurb}</small>
          </span>
          <span class="play" aria-hidden="true">▶</span>
        </a>`;
      }

      let favSig = '';

      // ---- The views ----
      function draw() {
        const f = location.hash.slice(1) || 'all';
        const q = search.value.trim().toLowerCase();
        const favList = P.favs().map(byId).filter(Boolean);
        favSig = favList.map(g => g.id).join();
        let html;

        if (q) {
          const found = GAMES.filter(g => `${g.name} ${g.origin} ${g.blurb} ${secName(g)}`.toLowerCase().includes(q));
          html = found.length
            ? `<div class="list">${found.map(g => row(g)).join('')}</div>`
            : '<p class="empty">No game matches that search.</p>';
        } else if (f === 'all' || !(f === 'kids' || f === 'favs' || SECTIONS.some(s => s.id === f))) {
          html = hero()
            + (favList.length ? shelf('favs', '♥ Your favourites', favList) : '')
            + shelf('kids', '★ Great for kids', GAMES.filter(g => g.kids), true)
            + SECTIONS.map(s => shelf(s.id, s.name, GAMES.filter(g => g.sec === s.id))).join('');
        } else {
          const info = f === 'kids' ? { name: 'Great for kids', blurb: 'Each one opens on its easiest setting', games: GAMES.filter(g => g.kids), kids: true }
            : f === 'favs' ? { name: 'Your favourites', blurb: 'The games you have hearted', games: favList }
            : { ...SECTIONS.find(s => s.id === f), games: GAMES.filter(g => g.sec === f) };
          html = `
            <div class="topbar"><a class="back" href="#all">‹ All games</a></div>
            <h2 class="view-title">${info.name} <small>${info.games.length}</small></h2>
            <p class="section-blurb">${info.blurb}</p>
            ${info.games.length ? `<div class="list">${info.games.map(g => row(g, info.kids)).join('')}</div>` : '<p class="empty">No favourites yet. Tap the ♡ on any game to keep it here.</p>'}`;
        }
        view.innerHTML = html;
        drawProgress();
      }

      // Last resort: a plain list of every game, so the home page can never be empty.
      function fallback() {
        view.innerHTML = SECTIONS.map(s => `<section class="shelf"><h2>${s.name}</h2><div class="list">${
          GAMES.filter(g => g.sec === s.id).map(g => `<div class="item"><a class="item-link" href="games/${g.id}/"><span class="mini${iconClass(g)}" aria-hidden="true">${g.icon}</span><span class="item-text"><b>${g.name}</b><small>${g.blurb}</small></span></a></div>`).join('')
        }</div></section>`).join('');
      }
      function safeDraw() {
        try { draw(); } catch (err) { console.error('Home page drawing failed, showing the plain list:', err); try { fallback(); } catch {} }
      }

      // ---- Streak line, and the folded away progress and backup section ----
      const when = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      function statusText() {
        if (!P.configured()) return 'Your progress is saved on this device.';
        if (!P.syncEnabled()) return 'Online backup is off. Your progress is saved on this device.';
        const s = P.status();
        return {
          ok: `Backed up online. Last saved at ${when(s.lastSync)}.`,
          syncing: 'Saving…',
          offline: 'You are offline. Saved on this device, and it will back up when you are back online.',
          error: 'Could not reach the server. Saved on this device. Trying again soon.',
        }[s.status] || 'Saved on this device. Backing up soon.';
      }
      function drawProgress() {
        const sum = P.summary();
        const has = sum.plays > 0 || sum.favourites > 0;
        // One quiet line under the title instead of a big panel.
        const sub = document.querySelector('header.top .sub');
        if (sub) sub.textContent = sum.plays > 0
          ? [sum.streak > 0 ? `${sum.streak}-day streak` : '', `${sum.plays} game${sum.plays === 1 ? '' : 's'} played`].filter(Boolean).join(' · ')
          : 'Quiet puzzles from around the world.';
        document.getElementById('progress').hidden = !has;
        document.getElementById('p-streak').textContent = sum.streak;
        document.getElementById('p-plays').textContent = sum.plays;
        document.getElementById('p-favs').textContent = sum.favourites;
        document.getElementById('p-status').textContent = statusText();
        const actions = document.getElementById('p-actions');
        if (!P.configured()) { actions.innerHTML = ''; return; }
        actions.innerHTML = P.syncEnabled()
          ? '<button class="btn ghost" data-act="copy">Copy progress code</button><button class="btn ghost" data-act="use">Use a code</button><button class="btn ghost" data-act="erase">Erase my online data</button>'
          : '<button class="btn" data-act="on">Back up my progress online</button><button class="btn ghost" data-act="use">Use a code</button>';
      }
      const note = text => { document.getElementById('p-note').textContent = text; };

      document.addEventListener('click', async e => {
        const heart = e.target.closest('[data-fav]');
        if (heart) { P.toggleFav(heart.dataset.fav); return; }
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'on') { P.setSyncEnabled(true); note('Online backup is on.'); }
        if (act === 'copy') {
          const code = P.exportCode();
          if (!code) return note('Play a game first, then there will be something to save.');
          try { await navigator.clipboard.writeText(code); note('Code copied. Keep it somewhere safe: anyone who has it can see and change your progress.'); }
          catch { prompt('Copy this progress code and keep it safe:', code); }
        }
        if (act === 'use') {
          const code = prompt('Paste the progress code from your other device:');
          if (!code) return;
          note('Checking…');
          const r = await P.useCode(code);
          note({ ok: 'Done. Your progress from both devices is now combined.', invalid: 'That does not look like a progress code.', unknown: 'That code was not recognised.' }[r] || 'Could not reach the server. Try again when you are online.');
        }
        if (act === 'erase' && confirm('Erase everything stored online?\n\nYour progress on this device stays, but it will no longer be backed up.')) {
          try { await P.eraseOnline(); note('Your online data was erased and backup is off.'); }
          catch { note('Could not erase just now. Check your connection and try again.'); }
        }
        drawProgress();
      });

      P.onChange(() => {
        const sig = P.favs().join();
        try { if (sig !== favSig) draw(); else drawProgress(); } catch (err) { console.error(err); }
      });

      // Install: a slim strip, using the browser's own prompt where there is one, and Share-sheet steps on iPhone and iPad.
      const install = document.getElementById('install');
      const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let promptEvent = null;
      const showInstall = () => { install.hidden = standalone || MG.store.get('install-dismissed') === '1'; };
      if (ios) {
        document.getElementById('install-text').innerHTML = 'Tap <b>Share</b> <span aria-hidden="true">⬆︎</span> in Safari, then <b>Add to Home Screen</b>.';
        showInstall();
      }
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        promptEvent = e;
        document.getElementById('install-btn').hidden = false;
        showInstall();
      });
      document.getElementById('install-btn').addEventListener('click', async () => {
        if (!promptEvent) return;
        promptEvent.prompt();
        await promptEvent.userChoice;
        promptEvent = null;
        install.hidden = true;
      });
      document.getElementById('install-close').addEventListener('click', () => { MG.store.set('install-dismissed', '1'); install.hidden = true; });
      window.addEventListener('appinstalled', () => { install.hidden = true; });

      search.addEventListener('input', safeDraw);
      window.addEventListener('hashchange', () => { search.value = ''; safeDraw(); window.scrollTo(0, 0); });
      safeDraw();
    })();
  </script>
</body>
</html>
