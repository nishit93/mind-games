    <noscript>
      <h2>All games</h2>
      <h3>Logic</h3>
      <ul>
        <li><a href="games/sudoku/">Sudoku</a> (Japan, 1984): Fill the grid with 1 to 9.</li>
        <li><a href="games/nonogram/">Nonogram</a> (Japan, 1987): Reveal a picture from number clues.</li>
        <li><a href="games/binary/">Binary</a> (Belgium, 2009): Fill the grid with two colours.</li>
        <li><a href="games/futoshiki/">Futoshiki</a> (Japan, 2001): Numbers that obey the arrows.</li>
        <li><a href="games/skyscrapers/">Skyscrapers</a> (Puzzle classic, 1990s): Build a city from the views.</li>
        <li><a href="games/tents/">Tents</a> (Netherlands, 1989): Pitch a tent beside every tree.</li>
        <li><a href="games/mines/">Mines</a> (USA, 1990): Clear the field without a blast.</li>
        <li><a href="games/lights-off/">Lights Off</a> (USA, 1995): Switch every light off.</li>
        <li><a href="games/pipes/">Pipes</a> (Puzzle classic, 2000s): Turn tiles to connect the network.</li>
        <li><a href="games/colour-flood/">Colour Flood</a> (Puzzle classic, 2000s): Flood the board in few moves.</li>
        <li><a href="games/eight-queens/">Eight Queens</a> (Germany, 1848): Place queens that never attack.</li>
        <li><a href="games/knights-tour/">Knight's Tour</a> (India, 800s): Visit every square with a knight.</li>
        <li><a href="games/bulls-and-cows/">Bulls & Cows</a> (Britain, 1800s): Crack the secret number.</li>
        <li><a href="games/one-stroke/">One Stroke</a> (Prussia, 1736): Draw every line without lifting your pen.</li>
      </ul>
      <h3>Math & numbers</h3>
      <ul>
        <li><a href="games/magic-square/">Magic Square</a> (China, ancient): Every line adds to the same total.</li>
        <li><a href="games/make-24/">Make 24</a> (China, 1900s): Four numbers, one target.</li>
        <li><a href="games/target-number/">Target Number</a> (France, 1965): Reach the target with six numbers.</li>
        <li><a href="games/next-in-line/">Next in Line</a> (India & Italy, ancient): Spot the rule and pick the next number.</li>
        <li><a href="games/number-pyramid/">Number Pyramid</a> (Germany, school classic): Each brick is the sum of two below.</li>
        <li><a href="games/cages/">Cages</a> (Japan, 2004): Latin squares with sums and products.</li>
        <li><a href="games/water-jugs/">Water Jugs</a> (Italy, 1500s): Measure exactly with odd jugs.</li>
        <li><a href="games/chinese-rings/">Chinese Rings</a> (China, ancient): Free every ring from the bar.</li>
        <li><a href="games/tchoukaillon/">Tchoukaillon</a> (Central Asia): Sow every seed into the store.</li>
      </ul>
      <h3>Sliding & shapes</h3>
      <ul>
        <li><a href="games/15-puzzle/">15-Puzzle</a> (USA, 1880s): Slide the tiles back into order.</li>
        <li><a href="games/hanoi/">Tower of Hanoi</a> (France, 1883): Move the tower, one disc at a time.</li>
        <li><a href="games/huarong-dao/">Huarong Dao</a> (China, early 1900s): Slide the blocks to free the general.</li>
        <li><a href="games/traffic-jam/">Traffic Jam</a> (Japan, 1970s): Clear a path for the red car.</li>
        <li><a href="games/maze/">Maze</a> (Crete, ancient): Find the way out of the maze.</li>
        <li><a href="games/warehouse/">Warehouse</a> (Japan, 1982): Push every crate onto a spot.</li>
        <li><a href="games/pentominoes/">Pentominoes</a> (England & USA, 1900s): Fit twelve shapes into a box.</li>
        <li><a href="games/peg-solitaire/">Peg Solitaire</a> (France, 1697): Jump pegs until one is left.</li>
        <li><a href="games/2048/">2048</a> (Italy, 2014): Merge tiles to reach 2048.</li>
      </ul>
      <h3>Memory & focus</h3>
      <ul>
        <li><a href="games/memory/">Shinkei-suijaku</a> (Japan): The memory game: find the pairs.</li>
        <li><a href="games/recall/">Recall</a> (USA, 1978): Repeat the growing pattern.</li>
        <li><a href="games/schulte-table/">Schulte Table</a> (Germany, 1900s): Find the numbers in order, fast.</li>
        <li><a href="games/grid-recall/">Grid Recall</a> (Memory science classic): Remember which squares lit up.</li>
        <li><a href="games/digit-span/">Digit Span</a> (Britain, 1887): Hold a growing number in mind.</li>
        <li><a href="games/odd-one-out/">Odd One Out</a> (Japan & USA, 1900s): Find the square with a slightly different shade.</li>
        <li><a href="games/colour-word/">Colour Word</a> (USA, 1935): Name the ink, not the word.</li>
        <li><a href="games/word-search/">Word Search</a> (USA, 1968): Find the hidden words in the grid.</li>
      </ul>
      <h3>Solitaire & tiles</h3>
      <ul>
        <li><a href="games/klondike/">Klondike</a> (North America, 1890s): The classic patience game.</li>
        <li><a href="games/pyramid/">Pyramid</a> (Europe, 1800s): Pair cards that add up to 13.</li>
        <li><a href="games/golf/">Golf</a> (Britain, 1900s): Clear cards one higher or lower.</li>
        <li><a href="games/mahjong-solitaire/">Mahjong Solitaire</a> (USA, 1981): Match free tiles in pairs.</li>
        <li><a href="games/free-cells/">Free Cells</a> (USA, 1978): All cards face up: plan your way home.</li>
        <li><a href="games/accordion/">Accordion</a> (Britain, 1900s): Fold the whole deck into one pile.</li>
        <li><a href="games/tripeaks/">Tri Peaks</a> (Patience classic): Clear three peaks, one up or down.</li>
        <li><a href="games/calculation/">Calculation</a> (Britain, 1800s): Build four rows by ones, twos, threes and fours.</li>
        <li><a href="games/monte-carlo/">Monte Carlo</a> (Patience classic): Pair up touching cards of the same number.</li>
      </ul>
    </noscript>

  <script src="shell.js"></script>
  <script>
    (() => {
      const view = document.getElementById('view');
      const search = document.getElementById('search');
      // The home page must draw even if progress tracking is missing (for example an old cached shell.js plus a failed progress.js).
      const P = window.MGProgress || {
        _stub: true, onChange() {}, isFav: () => false, favs: () => [], configured: () => false, syncEnabled: () => false,
        summary: () => ({ streak: 0, plays: 0, favourites: 0, days: 0 }), status: () => ({ status: 'off', lastSync: 0, hasPlayer: false }),
      };
      const M = window.MG || {};
      const esc = M.esc || (s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
      const badge = (g, short) => (M.badge ? M.badge(g, short) : '');
      const kidMode = () => !!(M.isKidMode && M.isKidMode());
      const vis = g => !kidMode() || !!g.kids;
      // Quiet personalisation: sections and games lean towards what this player plays (default order if similarity.js is missing).
      const rankSecs = list => (window.MGTaste ? MGTaste.rankSections(list) : list);
      // The default order inside every shelf and list is alphabetical (games.js lists the games for children first, which would bias every row).
      const neutral = list => [...list].sort((a, b) => a.name.localeCompare(b.name));
      const rankGs = list => (window.MGTaste ? MGTaste.rankGames(neutral(list)) : neutral(list));
      // Favourites and the player's own lists, as [{id, name, games, fav}]. An older progress.js has only favourites.
      const collections = () => (P.collections ? P.collections() : [{ id: 'favs', name: 'Favourites', games: P.favs(), fav: true }]);
      const byId = id => GAMES.find(g => g.id === id);
      const secName = g => SECTIONS.find(s => s.id === g.sec).name;
      const iconClass = g => ` sec-${g.sec}${g.icon.length > 2 ? ' small' : ''}`;
      const gamesOf = c => c.games.map(byId).filter(g => g && vis(g));
      const hashFor = c => (c.fav ? 'favs' : `l-${c.id}`);

      // ---- Pieces: cards with artwork, shelves, and list rows ----
      const art = g => (M.iconAttrs ? M.iconAttrs(g) : '');
      const heartOf = g => {
        const on = P.isFav(g.id);
        return P._stub ? '' : `<button class="heart" data-fav="${g.id}" aria-pressed="${on}" aria-label="${on ? 'Remove ' + g.name + ' from favourites' : 'Add ' + g.name + ' to favourites'}">♥</button>`;
      };
      const card = (g, kidsLink) => `
        <div class="gwrap" role="listitem">
          <a class="gcard" href="games/${g.id}/${kidsLink ? '?kids' : ''}">
            <span class="gicon${iconClass(g)}" ${art(g)} aria-hidden="true"><span class="gglyph">${g.icon}</span></span>
            ${g.kids ? badge(g, true) : ''}
            <span class="gname">${g.name}</span>
            <span class="gmeta">${g.origin}</span>
          </a>
          ${heartOf(g)}
        </div>`;

      const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const shelf = (id, title, games, kidsLink) => `
        <section class="shelf" data-shelf="${id}">
          <div class="shelf-head"><h2>${title}</h2><a class="see-all" href="#${id}" aria-label="See all ${games.length}" title="See all ${games.length}">${ARROW}</a></div>
          <div class="rail" role="list">${games.map(g => card(g, kidsLink)).join('')}</div>
        </section>`;

      const row = (g, kidsLink, removeFrom) => {
        const on = P.isFav(g.id);
        return `
        <div class="item">
          <a class="item-link" href="games/${g.id}/${kidsLink ? '?kids' : ''}">
            <span class="mini${iconClass(g)}" ${art(g)} aria-hidden="true"><span class="gglyph">${g.icon}</span></span>
            <span class="item-text"><b>${g.name}${g.kids ? ` ${badge(g)}` : ''}</b><small>${g.blurb}</small></span>
          </a>
          ${P._stub ? '' : `<button class="rowbtn addlist" data-addlist="${g.id}" aria-label="Save ${g.name} to a list" title="Save to a list">＋</button>`}
          ${removeFrom ? `<button class="rowbtn" data-remove="${g.id}" data-from="${removeFrom}" aria-label="Remove ${g.name} from this list" title="Remove from this list">✕</button>` : ''}
          ${P._stub ? '' : `<button class="heart" data-fav="${g.id}" aria-pressed="${on}" aria-label="${on ? 'Remove ' + g.name + ' from favourites' : 'Add ' + g.name + ' to favourites'}">${on ? '♥' : '♡'}</button>`}
        </div>`;
      };

      // Favourites and every list of the player's, side by side as chips; the games of the chosen chip are on the shelf below.
      let chosen = MG.store.get('mg-chip') || 'favs';
      function listsShelf(cols, km) {
        const custom = cols.filter(c => !c.fav);
        if (!custom.length && !gamesOf(cols[0] || { games: [] }).length) return '';   // nothing saved yet: keep the home page short
        const cur = cols.find(c => c.id === chosen) || cols[0];
        const games = gamesOf(cur);
        return `
        <section class="shelf lists-shelf" data-shelf="mylists">
          <div class="chips" role="group" aria-label="Your lists">
            ${cols.map(c => `<button class="chip" data-chip="${c.id}" aria-pressed="${c.id === cur.id}">${c.fav ? '♥ ' : ''}${esc(c.name)} <small>${gamesOf(c).length}</small></button>`).join('')}
            ${P._stub ? '' : '<a class="chip chip-add" href="#lists">＋ New list</a>'}
          </div>
          <div class="shelf-head"><h2>${cur.fav ? '♥ ' : ''}${esc(cur.name)}</h2><a class="see-all" href="#${hashFor(cur)}" aria-label="See all ${games.length}" title="See all ${games.length}">${ARROW}</a></div>
          ${games.length
            ? `<div class="rail" role="list">${games.map(g => card(g, km)).join('')}</div>`
            : `<p class="empty-rail">${cur.fav ? 'Tap the ♡ on any game to keep it here.' : 'Nothing here yet. Tap the ＋ on any game to add it.'}</p>`}
        </section>`;
      }

      // The puzzle of the day: a card with a little calendar, like a trip you are about to take.
      function dailyStrip() {
        try {
          const pick = dailyPick(kidMode()), g = byId(pick.id);
          if (!g) return '';
          const done = (M.dailyDone ? M.dailyDone() : []).includes(pick.date);
          const streak = M.dailyStreak ? M.dailyStreak() : 0;
          const now = new Date();
          return `
          <a class="daily${done ? ' done' : ''}" href="games/${g.id}/?daily=${pick.date}">
            <span class="daily-text">
              <small>${done ? '✓ ' : ''}Puzzle of the day</small>
              <b>${g.name}</b>
            </span>
            <span class="calart" aria-hidden="true"><i>${now.toLocaleDateString(window.MGLang ? MGLang.code : [], { month: 'short' })}</i><b>${now.getDate()}</b></span>
          </a>`;
        } catch { return ''; }
      }

      // About: what this is, who is behind it and why it is free. Plain text, edited here.
      function aboutHtml() {
        return `
        <div class="topbar"><a class="back" href="#all">‹ All games</a></div>
        <article class="about">
          <h2 class="view-title">About The Quiet Board</h2>
          <h3>What this is</h3>
          <p>The Quiet Board is a calm place to think: ${GAMES.length} single-player puzzle and mind games from around the world, in one quiet app. Logic grids, number puzzles, sliding pieces, memory games, patience card games and gentle find-it games for children. There are no ticking clocks, no lives to lose and nothing to rush. Play for two minutes or for an hour.</p>
          <h3>Who it is for</h3>
          <p>For anyone who is, well, quite bored: on a train, in a queue, at the end of a long day. And for children, who have a section of their own. Games with a smiling face are made for them, show an age range, and start on the easiest level.</p>
          <h3>Who we are</h3>
          <p>We are a small, independent team of puzzle lovers who got tired of noisy apps. Every game here has a short history on its page, because most of them are older than any of us: Tower of Hanoi is from 1883, Sudoku from 1984, and some solitaire games are older still.</p>
          <h3>Why it is free</h3>
          <p>Because puzzles belong to everybody. These games have been passed from person to person for generations, and it feels wrong to put a price on a quiet moment. We make this for the pleasure of it. There are no ads, no sign-up, no paywall, and we do not sell your attention or your data.</p>
          <h3>Your privacy</h3>
          <p>Your progress stays on your own device. If you want it, an anonymous backup lets you carry your streaks and scores to another phone with a progress code. It holds no name or email, only your country (guessed from your phone's time zone) and your language, so we can see roughly where people play. We never store your IP address.</p>
          <h3>Say hello</h3>
          <p>Found a bug, or a game we should add? Tell us. A puzzle you love is probably one somebody else would love too.</p>
          <p>Email us: <a href="mailto:nishitjain93@gmail.com">nishitjain93@gmail.com</a></p>
        </article>`;
      }

      // Your stats: the page's code is loaded when it is first opened.
      function showStats() {
        const draw = () => { try { MGStats.render(view, P); } catch (err) { console.error(err); view.innerHTML = '<div class="topbar"><a class="back" href="#all">‹ All games</a></div><p class="empty">Could not show your stats right now.</p>'; } };
        if (window.MGStats) return draw();
        const s = document.createElement('script');
        s.src = 'shared/stats.js';
        s.onload = () => { if (location.hash === '#stats') draw(); };
        s.onerror = () => { if (location.hash === '#stats') view.innerHTML = '<div class="topbar"><a class="back" href="#all">‹ All games</a></div><p class="empty">Could not load your stats. Check your connection and try again.</p>'; };
        document.head.append(s);
      }

      // One big, obvious thing to do: carry on where you left off, or try something new.
      function hero() {
        const pool = GAMES.filter(vis);
        const last = (MG.store.json('recent') || []).map(byId).find(g => g && vis(g));
        const g = last || pool[Math.floor(Date.now() / 86400000) % pool.length];
        return `
        <a class="hero" href="games/${g.id}/">
          <span class="hero-text">
            <span class="hero-label">${last ? 'Continue playing' : 'Today’s pick'}</span>
            <b>${g.name}</b>
            <small>${g.blurb}</small>
            <span class="hero-link">${g.kids ? badge(g) : g.origin}</span>
          </span>
          <span class="gicon hero-art${iconClass(g)}" ${art(g)} aria-hidden="true"><span class="gglyph">${g.icon}</span></span>
        </a>`;
      }

      // The category chips under the search: All, Kids and one for each section.
      const SEC_LABEL = s => s.short || s.name.replace(' & numbers', '').replace('Sliding & shapes', 'Sliding').replace('Memory & focus', 'Memory').replace('Solitaire & tiles', 'Cards');
      const SEC_GLYPH = { logic: '▦', math: '∑', moves: '▣', memory: '◉', cards: '♠' };
      const SEC_HUE = { logic: 352, math: 262, moves: 20, memory: 172, cards: 214 };
      // All, then Favourites and the player's own lists, then the sections, then Kids (kept low: the Kid mode switch is the way to see only those).
      function catsList() {
        const out = [{ id: 'all', label: 'All', glyph: '✦', hue: 28 }];
        const cols = collections();
        const custom = cols.filter(c => !c.fav);
        const fav = cols.find(c => c.fav);
        const haveFav = fav && gamesOf(fav).length > 0;
        if (haveFav || custom.length) {
          if (fav) out.push({ id: 'favs', chip: 'favs', label: 'Favourites', glyph: '♥', hue: 8 });
          custom.forEach(c => out.push({ id: 'l-' + c.id, chip: c.id, label: c.name, glyph: '☰', hue: 200 }));
        }
        SECTIONS.forEach(s => out.push({ id: s.id, label: SEC_LABEL(s), glyph: SEC_GLYPH[s.id] || '•', hue: SEC_HUE[s.id] || 200 }));
        if (!kidMode()) out.push({ id: 'kids', label: 'Kids', glyph: '☺', hue: 28 });
        return out;
      }
      function drawCats(f, searching) {
        const nav = document.getElementById('cats');
        if (!nav) return;
        const shows = !searching && !(f === 'stats' || f === 'lists' || f === 'foryou' || f === 'about');
        nav.hidden = !shows;
        if (!shows) return;
        const known = f === 'all' || f === 'kids' || f === 'favs' || f.startsWith('l-') || SECTIONS.some(s => s.id === f);
        const here = known ? f : 'all';
        nav.innerHTML = catsList().map(c => '<a class="cat' + (c.add ? ' cat-add' : '') + '" href="#' + c.id + '"' + (c.chip !== undefined ? ' data-chip="' + esc(c.chip) + '"' : '') + (c.id === here ? ' aria-current="page"' : '') + (c.add ? ' aria-label="New list" title="New list"' : '') + '>' + (c.glyph ? '<i class="cat-ic" style="--hh:' + c.hue + '" aria-hidden="true">' + c.glyph + '</i>' : '') + '<span>' + esc(c.label) + '</span></a>').join('');
        const cur = nav.querySelector('[aria-current]');
        if (cur) { try { nav.scrollLeft = Math.max(0, cur.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft - 16); } catch {} }
      }

      // Changes whenever a list, its name or its games change, so the page knows when to redraw.
      const signature = () => JSON.stringify(collections().map(c => [c.id, c.name, c.games]));
      let favSig = '';

      // ---- The views ----
      function draw() {
        const f = location.hash.slice(1) || 'all';
        const q = search.value.trim().toLowerCase();
        drawCats(f, !!q);
        document.body.dataset.view = q ? 'search' : (f === 'stats' || f === 'lists' || f === 'foryou' || f === 'about') ? 'sub' : 'browse';
        const cols = collections();
        favSig = signature();
        const km = kidMode();
        const custom = cols.filter(c => !c.fav);
        const current = f.startsWith('l-') ? custom.find(c => `l-${c.id}` === f) : f === 'favs' ? cols.find(c => c.fav) : null;
        let html;

        if (q) {
          const found = GAMES.filter(g => vis(g) && `${g.name} ${g.origin} ${g.blurb} ${secName(g)}`.toLowerCase().includes(q));
          html = found.length
            ? `<div class="list">${found.map(g => row(g)).join('')}</div>`
            : '<p class="empty">No game matches that search.</p>';
        } else if (f === 'foryou') {
          const rec = window.MGTaste ? MGTaste.recommend(GAMES.filter(vis)) : { games: [], reason: {}, cold: true };
          const why = g => { const b = byId(rec.reason[g.id]); return b ? { ...g, blurb: 'Like ' + b.name + ' · ' + g.blurb } : g; };
          html = `
            <div class="topbar"><a class="back" href="#all">‹ All games</a></div>
            <h2 class="view-title">For you <small>${rec.games.length || ''}</small></h2>
            <p class="section-blurb">Games that sit close to the ones you play, and that you have not played much yet. It learns quietly, on this device only.</p>
            ${rec.games.length ? `<div class="list">${rec.games.map(g => row(why(g), km)).join('')}</div>` : `<p class="empty">${rec.cold ? 'Play a few games and this page will start suggesting others you might like.' : 'Nothing new sits close to your taste right now. Try something from the Play tab.'}</p>`}`;
        } else if (f === 'about') {
          html = aboutHtml();
        } else if (f === 'stats') {
          html = '<div class="topbar"><a class="back" href="#all">‹ All games</a></div><p class="empty">Loading…</p>';
        } else if (f === 'lists') {
          html = `
            <div class="topbar"><a class="back" href="#all">‹ All games</a></div>
            <h2 class="view-title">Your lists <small>${cols.length}</small></h2>
            <p class="section-blurb">Group games your own way, like a playlist. Favourites is a list too. Add a game to a list with the ＋ on any game.</p>
            ${P._stub ? '' : '<form class="newlist" data-newlist><input maxlength="40" placeholder="Name a new list, for example Train rides" aria-label="Name of a new list" autocomplete="off"><button class="btn" type="submit">Create list</button></form>'}
            <div class="list">${cols.map(c => `
              <div class="item"><a class="item-link" href="#${hashFor(c)}">
                <span class="mini listicon" aria-hidden="true">${c.fav ? '♥' : '☰'}</span>
                <span class="item-text"><b>${esc(c.name)}</b><small>${gamesOf(c).length} game${gamesOf(c).length === 1 ? '' : 's'}</small></span>
              </a></div>`).join('')}</div>`;
        } else if (current) {
          const games = gamesOf(current);
          html = `
            <div class="topbar"><a class="back" href="#${current.fav ? 'all' : 'lists'}">‹ ${current.fav ? 'All games' : 'Your lists'}</a></div>
            <h2 class="view-title">${current.fav ? '♥ ' : ''}${esc(current.name)} <small>${games.length}</small></h2>
            <p class="section-blurb">${current.fav ? 'The games you have hearted' : 'Your list'}</p>
            ${current.fav ? '' : '<div class="list-actions"><button class="btn ghost" data-act="rename-list" data-list="' + current.id + '">Rename</button><button class="btn ghost" data-act="delete-list" data-list="' + current.id + '">Delete list</button></div>'}
            ${games.length ? `<div class="list">${games.map(g => row(g, km, current.fav ? '' : current.id)).join('')}</div>` : `<p class="empty">${current.fav ? 'No favourites yet. Tap the ♡ on any game to keep it here.' : 'Nothing here yet. Tap the ＋ on any game to add it.'}</p>`}`;
        } else if (f === 'all' || !(f === 'kids' || SECTIONS.some(s => s.id === f))) {
          html = `<div class="duo">${dailyStrip()}${hero()}</div>`
            + rankSecs(SECTIONS).map(s => ({ s, games: rankGs(GAMES.filter(g => g.sec === s.id && vis(g))) })).filter(x => x.games.length).map(x => shelf(x.s.id, x.s.name, x.games, km)).join('');
        } else {
          const info = f === 'kids' ? { name: 'Great for kids', blurb: 'Made for children up to 11. Each one opens on its easiest setting.', games: rankGs(GAMES.filter(g => g.kids)), kids: true }
            : { ...SECTIONS.find(s => s.id === f), games: rankGs(GAMES.filter(g => g.sec === f && vis(g))), kids: km };
          html = `
            <div class="topbar"><a class="back" href="#all">‹ All games</a></div>
            <h2 class="view-title">${info.name} <small>${info.games.length}</small></h2>
            <p class="section-blurb">${info.blurb}</p>
            ${info.games.length ? `<div class="list">${info.games.map(g => row(g, info.kids)).join('')}</div>` : '<p class="empty">Nothing here.</p>'}`;
        }
        view.innerHTML = html;
        if (f === 'stats' && !q) showStats();
        drawProgress();
      }

      // Last resort: a plain list of every game, so the home page can never be empty.
      function fallback() {
        view.innerHTML = SECTIONS.map(s => `<section class="shelf"><h2>${s.name}</h2><div class="list">${
          GAMES.filter(g => g.sec === s.id).map(g => `<div class="item"><a class="item-link" href="games/${g.id}/"><span class="mini${iconClass(g)}" aria-hidden="true">${g.icon}</span><span class="item-text"><b>${g.name}</b><small>${g.blurb}</small></span></a></div>`).join('')
        }</div></section>`).join('');
      }
      function safeDraw() {
        try { draw(); } catch (err) { console.error('Home page drawing failed, showing the plain list:', err); try { fallback(); } catch {} }
      }

      // ---- Streak line, and the folded away progress and backup section ----
      const when = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      function statusText() {
        if (!P.configured()) return 'Your progress is saved on this device.';
        if (!P.syncEnabled()) return 'Online backup is off. Your progress is saved on this device.';
        const s = P.status();
        return {
          ok: `Backed up online. Last saved at ${when(s.lastSync)}.`,
          syncing: 'Saving…',
          offline: 'You are offline. Saved on this device, and it will back up when you are back online.',
          error: 'Could not reach the server. Saved on this device. Trying again soon.',
        }[s.status] || 'Saved on this device. Backing up soon.';
      }
      function drawProgress() {
        const sum = P.summary();
        const has = sum.plays > 0 || sum.favourites > 0 || (P.lists && P.lists().length > 0);
        // One quiet line under the title instead of a big panel.
        const sub = document.querySelector('header.top .sub');
        if (sub) {
          // Always the same line: the streak lives on the Progress page only.
          sub.innerHTML = 'Quite bored? <a href="#" id="surprise">Surprise me</a>';
        }
        document.getElementById('progress').hidden = !has || location.hash !== '#stats';
        document.getElementById('about-link').hidden = location.hash !== '#stats';
        const _pstreak = document.getElementById('p-streak'); if (_pstreak) _pstreak.textContent = sum.streak;
        const _pplays = document.getElementById('p-plays'); if (_pplays) _pplays.textContent = sum.plays;
        const _pfavs = document.getElementById('p-favs'); if (_pfavs) _pfavs.textContent = sum.favourites;
        document.getElementById('p-status').textContent = statusText();
        const actions = document.getElementById('p-actions');
        if (!P.configured()) { actions.innerHTML = ''; return; }
        actions.innerHTML = P.syncEnabled()
          ? '<button class="btn ghost" data-act="copy">Copy progress code</button><button class="btn ghost" data-act="use">Use a code</button><button class="btn ghost" data-act="erase">Erase my online data</button>'
          : '<button class="btn" data-act="on">Back up my progress online</button><button class="btn ghost" data-act="use">Use a code</button>';
      }
      const note = text => { document.getElementById('p-note').textContent = text; };

      document.addEventListener('click', async e => {
        const chip = e.target.closest('[data-chip]');
        if (chip) { chosen = chip.dataset.chip; MG.store.set('mg-chip', chosen); safeDraw(); return; }
        const heart = e.target.closest('[data-fav]');
        if (heart) { P.toggleFav(heart.dataset.fav); return; }
        const add = e.target.closest('[data-addlist]');
        if (add) { if (M.saveSheet) M.saveSheet(add.dataset.addlist); return; }
        const rm = e.target.closest('[data-remove]');
        if (rm) { P.setInList(rm.dataset.from, rm.dataset.remove, false); return; }
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'rename-list') {
          const cur = collections().find(c => c.id === btn.dataset.list);
          const name = prompt('Rename this list:', cur ? cur.name : '');
          if (name && P.renameList(btn.dataset.list, name)) safeDraw();
          return;
        }
        if (act === 'delete-list') {
          const cur = collections().find(c => c.id === btn.dataset.list);
          if (cur && confirm(`Delete the list “${cur.name}”?\n\nThe games stay; only the list is removed.`)) { P.deleteList(btn.dataset.list); location.hash = '#lists'; safeDraw(); }
          return;
        }
        if (act === 'on') { P.setSyncEnabled(true); note('Online backup is on.'); }
        if (act === 'copy') {
          const code = P.exportCode();
          if (!code) return note('Play a game first, then there will be something to save.');
          try { await navigator.clipboard.writeText(code); note('Code copied. Keep it somewhere safe: anyone who has it can see and change your progress.'); }
          catch { prompt('Copy this progress code and keep it safe:', code); }
        }
        if (act === 'use') {
          const code = prompt('Paste the progress code from your other device:');
          if (!code) return;
          note('Checking…');
          const r = await P.useCode(code);
          note({ ok: 'Done. Your progress from both devices is now combined.', invalid: 'That does not look like a progress code.', unknown: 'That code was not recognised.' }[r] || 'Could not reach the server. Try again when you are online.');
        }
        if (act === 'erase' && confirm('Erase everything stored online?\n\nYour progress on this device stays, but it will no longer be backed up.')) {
          try { await P.eraseOnline(); note('Your online data was erased and backup is off.'); }
          catch { note('Could not erase just now. Check your connection and try again.'); }
        }
        drawProgress();
      });

      // Creating a list from the Your lists page.
      document.addEventListener('submit', e => {
        const form = e.target.closest('[data-newlist]');
        if (!form) return;
        e.preventDefault();
        const input = form.querySelector('input');
        if (P.createList && P.createList(input.value)) { input.value = ''; safeDraw(); }
        else { input.classList.add('bad'); setTimeout(() => input.classList.remove('bad'), 600); }
      });

      P.onChange(() => {
        try { if (signature() !== favSig) safeDraw(); else drawProgress(); } catch (err) { console.error(err); }
      });

      // Install: a slim strip, using the browser's own prompt where there is one, and Share-sheet steps on iPhone and iPad.
      const install = document.getElementById('install');
      const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let promptEvent = null;
      const showInstall = () => { install.hidden = standalone || MG.store.get('install-dismissed') === '1'; };
      if (ios) {
        document.getElementById('install-text').innerHTML = 'Tap <b>Share</b> <span aria-hidden="true">⬆︎</span> in Safari, then <b>Add to Home Screen</b>.';
        showInstall();
      }
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        promptEvent = e;
        document.getElementById('install-btn').hidden = false;
        showInstall();
      });
      document.getElementById('install-btn').addEventListener('click', async () => {
        if (!promptEvent) return;
        promptEvent.prompt();
        await promptEvent.userChoice;
        promptEvent = null;
        install.hidden = true;
      });
      document.getElementById('install-close').addEventListener('click', () => { MG.store.set('install-dismissed', '1'); install.hidden = true; });
      window.addEventListener('appinstalled', () => { install.hidden = true; });

      // Coming back with the Back button shows the page as it was left: redraw so favourites and "Continue playing" are current.
      window.addEventListener('pageshow', e => { if (e.persisted) { try { P.refresh && P.refresh(); } catch {} safeDraw(); } });
      search.addEventListener('input', safeDraw);
      // A new view (another list, a search) fades in; a redraw after a heart tap does not.
      const enter = () => { view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); view.querySelectorAll('.list > .item').forEach((el, i) => el.style.setProperty('--i', Math.min(i, 12))); };
      // The Quiet Board, quite bored: one tap opens a random game (only games for children in kid mode).
      document.addEventListener('click', e => {
        const a = e.target.closest && e.target.closest('#surprise');
        if (!a) return;
        e.preventDefault();
        try { P.track('f.surprise'); } catch { /* optional */ }
        const pool = GAMES.filter(vis);
        const g = pool[Math.floor(Math.random() * pool.length)];
        if (g) location.href = `games/${g.id}/` + (kidMode() ? '?kids' : '');
      });
      window.addEventListener('hashchange', () => { search.value = ''; safeDraw(); enter(); window.scrollTo(0, 0); });
      // Kid mode was switched in the header or the menu.
      document.addEventListener('mg-kidmode', () => { safeDraw(); enter(); });
      safeDraw();
      enter();
    })();
  </script>
</body>
</html>
