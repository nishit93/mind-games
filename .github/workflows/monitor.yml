# Checks the website and the progress server every 20 minutes. If anything is wrong the run fails and GitHub
# emails the repository owner (Settings, Notifications, Actions: "Send notifications for failed workflows only").
# It only reads public addresses. Run it by hand from the Actions tab with "Run workflow".
name: Health check

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/monitor.sh
